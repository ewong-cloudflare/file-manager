name = "cf-file-manager"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "../ui/dist"
binding = "ASSETS"

[[r2_buckets]]
binding = "my_files"
bucket_name = "my-files"

[[durable_objects.bindings]]
name = "DOWNLOAD_TOKENS"
class_name = "DownloadTokenDO"

[[migrations]]
tag = "v1"
new_classes = ["DownloadTokenDO"]

[[d1_databases]]
binding     = "DB"
database_name = "file-manager-shares"
database_id   = "04fb5893-dd4d-4697-af3f-ace5f4bc4304"

[vars]
ENVIRONMENT = "production"

# Secrets — set these via `wrangler secret put <NAME>`:
#   R2_ACCOUNT_ID        — your Cloudflare account ID
#   R2_ACCESS_KEY_ID     — R2 API token access key
#   R2_SECRET_ACCESS_KEY — R2 API token secret key
#   R2_BUCKET_NAME       — same as bucket_name above
#   CF_ACCESS_AUD        — Cloudflare Access application AUD tag
#   CF_TEAM_DOMAIN       — e.g. acmecorp.cloudflareaccess.com
