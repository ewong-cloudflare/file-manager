name = "cf-file-manager"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "../ui/dist"
binding = "ASSETS"

[[r2_buckets]]
binding = "FILES"
bucket_name = "your-r2-bucket"

[[durable_objects.bindings]]
name = "DOWNLOAD_TOKENS"
class_name = "DownloadTokenDO"

[[migrations]]
tag = "v1"
new_classes = ["DownloadTokenDO"]

[vars]
ENVIRONMENT = "development"

# Secrets — set these via `wrangler secret put <NAME>`:
#   R2_ACCOUNT_ID       — your Cloudflare account ID
#   R2_ACCESS_KEY_ID    — R2 API token access key
#   R2_SECRET_ACCESS_KEY — R2 API token secret key
#   R2_BUCKET_NAME      — same as bucket_name above
#   CF_ACCESS_AUD       — Cloudflare Access application AUD tag (when ready)
